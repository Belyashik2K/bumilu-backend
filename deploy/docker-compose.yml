name: bumilu-backend
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    profiles: [ "routing" ]
    environment:
      - serve_tiles=True
    volumes:
      - ../valhalla_data:/custom_files
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8002/status" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - bumilu
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    env_file: [ ../.env ]
    environment:
      POSTGRES_USER: ${DATABASE__USER}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
      POSTGRES_DB: ${DATABASE__NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - bumilu
  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    env_file: [ ../.env ]
    command: [ "redis-server", "--requirepass", "${REDIS__PASSWORD}" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping", "-a", "${REDIS__PASSWORD}" ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - bumilu
  migrations:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    env_file: [ ../.env ]
    command: [ "alembic", "upgrade", "head" ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bumilu
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [ ../.env ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - bumilu
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [ ../.env ]
    command: [
      "taskiq",
      "worker",
      "app.core.infrastructure.queue.worker:broker",
      "--workers",
      "${TASKIQ__WORKERS_COUNT}"
    ]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - bumilu
  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [ ../.env ]
    command: [
      "taskiq",
      "scheduler",
      "app.core.infrastructure.schedulers.taskiq:scheduler",
      "--update-interval",
      "${TASKIQ__SCHEDULER__POLLING_INTERVAL}"
    ]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - bumilu
networks:
  bumilu:
    external: true
volumes:
  postgres_data:
  redis_data:
