name: bumilu-users-service
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: [ .env ]
    environment:
      POSTGRES_USER: ${DATABASE__USER}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
      POSTGRES_DB: ${DATABASE__NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 1s
      retries: 5
    networks:
      - bumilu
  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    env_file: [ .env ]
    command: [ "redis-server", "--requirepass", "${REDIS__PASSWORD}" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping", "-a", "${REDIS__PASSWORD}" ]
      interval: 1s
      retries: 5
    networks:
      - bumilu
  migrations:
    build: .
    restart: "no"
    env_file: [ .env ]
    command: [ "alembic", "upgrade", "head" ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bumilu
  api:
    build: .
    restart: unless-stopped
    env_file: [ .env ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - bumilu
  worker:
    build: .
    restart: unless-stopped
    env_file: [ .env ]
    command: [
      "taskiq",
      "worker",
      "app.core.infrastructure.queue.worker:broker",
      "--workers",
      "${TASKIQ__WORKERS_COUNT}"
    ]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - bumilu
  scheduler:
    build: .
    restart: unless-stopped
    env_file: [ .env ]
    command: [
      "taskiq",
      "scheduler",
      "app.core.infrastructure.taskiq_scheduler:scheduler",
      "--update-interval",
      "${TASKIQ__SCHEDULER__POLLING_INTERVAL}"
    ]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - bumilu
networks:
  bumilu:
volumes:
  postgres_data:
  redis_data:
