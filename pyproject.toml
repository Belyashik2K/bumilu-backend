[project]
name = "bumilu-backend"
version = "0.1.0"
description = "Backend for mobile ans web application BumiLu (不迷路), PAB project"
readme = "README.md"
authors = [
    { name = "Belyashik2K", email = "lovelybelyashik@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[all]>=0.129.0",
    "gunicorn>=25.0.3",
    "pydantic-settings[yaml]>=2.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
